<!DOCTYPE html>

<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
  >

    <title>CP3 simulator</title>

    <link rel="icon" type="image/webp" href="/assets/icon.png">
    <link rel="stylesheet" href="/src/css/main-menu.css">
    <link rel="stylesheet" href="/src/css/context-menu.css">

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }

      #canvas {
        width: 100%;
        height: 100%;

        display: block;
      }
    </style>
  </head>

  <body>
    <canvas id="canvas"></canvas>

    <!-- --------- -->
    <!-- main menu -->
    <!-- --------- -->

    <div class="main-menu">

      <!-- header -->

      <div class="main-menu-header">
        <img src="/assets/arrow-up-svgrepo-com.svg">
      </div>

      <div class="main-menu-body">

        <!-- camera switch -->

        <div class="main-menu-body-element">
          <button class="main-menu-body-element-btn" id="camera-btn">
            <img src="/assets/camera-outlined-svgrepo-com.svg">
            Alternar visualização (2D/3D)
          </button>
        </div>

        <!-- add stick -->

        <div class="main-menu-body-element">
          <button class="main-menu-body-element-btn" id="stick-btn">
            <img src="/assets/zoom-out-svgrepo-com.svg">
            Adicionar novo palito
          </button>
        </div>

        <!-- weight analysis -->

        <div class="main-menu-body-element">
          <button class="main-menu-body-element-btn" id="analyze-btn">
            <img src="/assets/weight-hanging-svgrepo-com.svg">
            Analisar cargas
          </button>
        </div>
      </div>
    </div>

    <!-- ------------ -->
    <!-- context menu -->
    <!-- ------------ -->

    <div class="context-menu" id="context-menu">

      <!-- header -->

      <div class="context-menu-header"></div>

      <div class="context-menu-body">

        <!-- stick angle -->

        <div class="context-menu-body-element">
          <label class="context-menu-body-element-label icon-angle"
            >Ângulo: <span id="angle-display">0°</span></label
          >

          <input
            class="context-menu-body-element-slider"
            id="angle-slider"
            type="range"
            min="-180"
            max="180"
            step="0.01"
            value="0"
        >
          <input
            class="context-menu-body-element-number"
            id="angle-number"
            type="number"
            value="0"
        >
        </div>

        <!-- stick scale -->

        <div class="context-menu-body-element">
          <label class="context-menu-body-element-label icon-length"
            >Comprimento: <span id="length-display">cm</span></label
          >

          <input
            class="context-menu-body-element-slider"
            id="length-slider"
            type="range"
            min="0.1"
            max="1.0"
            step="0.01"
            value="1.0"
        >
          <input
            class="context-menu-body-element-number"
            id="length-number"
            type="number"
            value="0"
        >
        </div>

        <!-- separate stick -->

        <div class="context-menu-body-element">
          <button class="context-menu-body-element-btn" id="btn-separate">Separar palito</button>
        </div>

        <!-- delete stick -->

        <div class="context-menu-body-element">
          <button class="context-menu-body-element-btn" id="btn-delete">Excluir palito</button>
        </div>

        <!-- stick internal force -->

        <div class="context-menu-body-element">
          <label class="context-menu-body-element-label">
            Esforço Interno: <span id="force-display">Não calculado</span>
          </label>
        </div>
      </div>
    </div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
